name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pearl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: nail-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nail-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/pearl_test
      - name: Browser tests
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          export CHROMIUM_PATH
          "$CHROMIUM_PATH" --version
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: nail-studio/test-output/
